name: Full verification
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the approved Verify Helper candidate
        working-directory: ${{ runner.temp }}
        run: |
          wheel=verify_helper-2.0.0rc4-py3-none-any.whl
          curl --fail --location --proto '=https' --output "$wheel" \
            "https://github.com/ngwddd/verify-helper/releases/download/v2.0.0-rc4/$wheel"
          printf '%s  %s\n' '0a6926a72e94fdfd47d644a29ce5b2c38fdf561353c660d1bce9d0c2635be7cb' "$wheel" | sha256sum --check
          python -m pip install "./$wheel"
      - name: Full verification
        run: |
          set +e
          verify-helper run . --sarif verify.sarif --evidence-dir "${{ runner.temp }}/vh-evidence"
          verdict=$?
          if [ "$verdict" -eq 2 ]; then
            echo "::notice::Full verification could not establish complete protected evidence."
          fi
          exit "$verdict"
