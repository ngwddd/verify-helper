name: Full verification
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the approved Verify Helper candidate
        run: python -m pip install verify_helper-2.0.0rc4-py3-none-any.whl
      - name: Full verification
        run: verify-helper run . --sarif verify.sarif --evidence-dir "${{ runner.temp }}/vh-evidence"
