name: Full verification
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the approved Verify Helper candidate
        working-directory: ${{ runner.temp }}
        run: |
          wheel=verify_helper-2.0.1rc3-py3-none-any.whl
          release='https://github.com/ngwddd/verify-helper/releases/download/v2.0.1-rc3'
          curl --fail --location --proto '=https' --output "$wheel" \
            "$release/$wheel"
          curl --fail --location --proto '=https' --output SHA256SUMS "$release/SHA256SUMS"
          awk -v filename="*$wheel" '$2 == filename { print }' SHA256SUMS | sha256sum --check
          python -m pip install "./$wheel"
      - name: Full verification
        run: |
          set +e
          verify-helper run . --sarif verify.sarif --evidence-dir "${{ runner.temp }}/vh-evidence"
          verdict=$?
          if [ "$verdict" -eq 2 ]; then
            echo "::notice::Full verification could not establish complete protected evidence."
          fi
          exit "$verdict"
