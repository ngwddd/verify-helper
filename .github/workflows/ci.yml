name: ci

on:
  push:
    branches: [main, 'v2.0/development']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Unit and MCP protocol tests
        run: uv run python -m unittest discover -s tests -v
      - name: Conformance
        run: uv run python conformance.py
      - name: Language and browser acceptance
        if: matrix.python == '3.12'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:RUNNER_TEMP vh-toolchain
          npm install --prefix $toolchain --no-save --no-audit --no-fund playwright@1.65.1 typescript@7.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.cmd' } else { '' }
          $browserArgs = if ($IsWindows) { @('install', 'chromium') } else { @('install', '--with-deps', 'chromium') }
          & (Join-Path $toolchain "node_modules/.bin/playwright$suffix") @browserArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vsVersion = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
            $env:CMAKE_GENERATOR = switch (([version]$vsVersion).Major) {
              17 { 'Visual Studio 17 2022' }
              18 { 'Visual Studio 18 2026' }
              default { throw "Unsupported Visual Studio version: $vsVersion" }
            }
            "CMAKE_GENERATOR=$env:CMAKE_GENERATOR" >> $env:GITHUB_ENV
          }
          $env:VERIFY_PLAYWRIGHT_ROOT = $toolchain
          $env:VERIFY_TSC = Join-Path $toolchain "node_modules/.bin/tsc$suffix"
          $env:VERIFY_NATIVE_FIXTURE = '1'
          uv run python -m unittest discover -s tests -p test_full_verify.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VERIFY_PLAYWRIGHT_ROOT=$env:VERIFY_PLAYWRIGHT_ROOT" >> $env:GITHUB_ENV
          "VERIFY_TSC=$env:VERIFY_TSC" >> $env:GITHUB_ENV
          "VERIFY_NATIVE_FIXTURE=1" >> $env:GITHUB_ENV
      - name: Build and verify distribution
        if: matrix.python == '3.12'
        shell: pwsh
        run: |
          uv build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:VERIFY_TEST_PYTHON = uv run python -c "import sys; print(sys.executable)"
          $evidence = Join-Path $env:RUNNER_TEMP vh-evidence
          $json = uv run verify-helper . --trust-project-code --evidence-dir $evidence --json
          $verdictCode = $LASTEXITCODE
          $report = $json | ConvertFrom-Json
          if (@($report.checks | Where-Object { $_.id -like 'delivery-*' -and $_.state -eq 'PASS' }).Count -ne 2) {
            throw "Delivery verification failed"
          }
          if ($verdictCode -ne 0) {
            $report.checks | Where-Object { $_.id -in $report.plan.PSObject.Properties.Name -and $_.state -ne 'PASS' } |
              Select-Object id, state, detail, output | Format-List
            throw "Self-verification did not pass"
          }
          $wheel = (Get-ChildItem -LiteralPath dist -Filter '*.whl').FullName
          uv run --no-project --with $wheel verify-helper --list-checks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project --with $wheel verify-helper-mcp --help
      - name: Retain verification evidence
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/vh-evidence
          if-no-files-found: warn
