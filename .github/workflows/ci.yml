name: ci

on:
  push:
    branches: [main, 'v2.0/development', 'v2.0/rc3']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-isolation:
    name: Linux isolation acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Run offline guest boundary checks
        shell: bash
        run: |
          docker info --format '{{.OSType}} {{.DefaultRuntime}} {{json .SecurityOptions}} {{.MemoryLimit}} {{.SwapLimit}} {{.PidsLimit}}'
          docker pull python:3.12-slim
          export VERIFY_HELPER_SANDBOX_IMAGE="$(docker image inspect --format '{{.Id}}' python:3.12-slim)"
          printf 'Acceptance image ID: %s\n' "$VERIFY_HELPER_SANDBOX_IMAGE"
          uv run python -m unittest discover -s tests -p sandbox_acceptance.py -v

  verification:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Unit and MCP protocol tests
        run: uv run python -m unittest discover -s tests -v
      - name: Conformance
        run: uv run python conformance.py
      - name: Language and browser acceptance
        if: matrix.python == '3.12'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:RUNNER_TEMP vh-toolchain
          npm install --prefix $toolchain --no-save --no-audit --no-fund playwright@1.65.1 typescript@7.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.cmd' } else { '' }
          $browserArgs = if ($IsWindows) { @('install', 'chromium') } else { @('install', '--with-deps', 'chromium') }
          & (Join-Path $toolchain "node_modules/.bin/playwright$suffix") @browserArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            $native = Join-Path $env:RUNNER_TEMP vh-native
            uv venv --python 3.12 $native
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            uv pip install --python (Join-Path $native 'Scripts/python.exe') cmake==4.4.5 ninja==1.13.2 ziglang==0.17.1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $scripts = Join-Path $native Scripts
            $zig = (Join-Path $native 'Lib/site-packages/ziglang/zig.exe').Replace('\', '/')
            $env:Path = $scripts + [IO.Path]::PathSeparator + $env:Path
            $env:CC = "$zig cc"
            $env:CXX = "$zig c++"
            $env:CMAKE_GENERATOR = 'Ninja'
            $env:ZIG_GLOBAL_CACHE_DIR = Join-Path $native 'zig-cache'
            $source = Join-Path $native 'compiler-probe.c'
            $wrapper = Join-Path $native 'compiler-probe.cpp'
            Set-Content -LiteralPath $source -Value 'int main(void) { return 0; }'
            Set-Content -LiteralPath $wrapper -Value '#include <string>', 'int main() { return std::string("ok").size() != 2; }'
            & $zig cc $source -o (Join-Path $native 'probe-c.exe')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $zig c++ $wrapper -o (Join-Path $native 'probe-cpp.exe')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $scripts >> $env:GITHUB_PATH
            "CC=$env:CC" >> $env:GITHUB_ENV
            "CXX=$env:CXX" >> $env:GITHUB_ENV
            "CMAKE_GENERATOR=$env:CMAKE_GENERATOR" >> $env:GITHUB_ENV
            "ZIG_GLOBAL_CACHE_DIR=$env:ZIG_GLOBAL_CACHE_DIR" >> $env:GITHUB_ENV
          }
          $env:VERIFY_PLAYWRIGHT_ROOT = $toolchain
          $env:VERIFY_TSC = Join-Path $toolchain "node_modules/.bin/tsc$suffix"
          $env:VERIFY_NATIVE_FIXTURE = '1'
          uv run python -m unittest discover -s tests -p test_full_verify.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VERIFY_PLAYWRIGHT_ROOT=$env:VERIFY_PLAYWRIGHT_ROOT" >> $env:GITHUB_ENV
          "VERIFY_TSC=$env:VERIFY_TSC" >> $env:GITHUB_ENV
          "VERIFY_NATIVE_FIXTURE=1" >> $env:GITHUB_ENV
      - name: Build and verify distribution
        if: matrix.python == '3.12'
        shell: pwsh
        run: |
          uv build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:VERIFY_HELPER_TEST_PYTHON = uv run python -c "import sys; print(sys.executable)"
          $env:VERIFY_SCRATCH_DIRECTORY = $env:RUNNER_TEMP
          $evidence = Join-Path $env:RUNNER_TEMP vh-evidence
          $json = uv run verify-helper . --trust-project-code --evidence-dir $evidence --json
          $verdictCode = $LASTEXITCODE
          $report = $json | ConvertFrom-Json
          if ($report.git.head -ne $env:GITHUB_SHA -or $report.git.dirty -ne $false -or !$report.releasable) {
            throw "Self-verification must certify the exact clean CI commit"
          }
          if (@($report.checks | Where-Object { $_.id -like 'delivery-*' -and $_.state -eq 'PASS' }).Count -ne 2) {
            throw "Delivery verification failed"
          }
          if ($verdictCode -ne 0) {
            $report.checks | Where-Object { $_.id -in $report.plan.PSObject.Properties.Name -and $_.state -ne 'PASS' } |
              Select-Object id, state, detail, output | Format-List
            throw "Self-verification did not pass"
          }
          $wheel = (Get-ChildItem -LiteralPath dist -Filter '*.whl').FullName
          uv run --no-project --with $wheel verify-helper --list-checks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project --with $wheel verify-helper-mcp --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $delivery = Join-Path $env:RUNNER_TEMP vh-distribution
          New-Item -ItemType Directory -Path $delivery -Force | Out-Null
          $files = Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -like '*.whl' -or $_.Name -like '*.tar.gz' }
          $hashes = foreach ($file in $files) {
            $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not ($report.checks | Where-Object { $_.id -like 'delivery-*' -and $_.state -eq 'PASS' -and $_.detail.Contains($digest) })) {
              throw "Distribution file digest not linked to passing evidence: $($file.Name)"
            }
            Copy-Item -LiteralPath $file.FullName -Destination $delivery
            "$digest *$($file.Name)"
          }
          $hashes | Set-Content -LiteralPath (Join-Path $delivery SHA256SUMS) -Encoding utf8NoBOM
          [ordered]@{
            version = $report.version
            commit = $report.git.head
            workflow_run = $env:GITHUB_RUN_ID
            snapshot_sha256 = $report.snapshot_sha256
            plan_digest = $report.plan_digest
            evidence_manifest_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $report.evidence_dir manifest.json)).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $delivery provenance.json) -Encoding utf8NoBOM
      - name: Retain candidate distribution
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-py3.12
          path: ${{ runner.temp }}/vh-distribution
          if-no-files-found: error
      - name: Retain verification evidence
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/vh-evidence
          if-no-files-found: warn
